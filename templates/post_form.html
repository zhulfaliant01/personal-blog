{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="max-w-3xl mx-auto mt-8 mb-16 px-4">
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <h1 class="card-title text-3xl font-bold text-center mb-6">Create a New Blog Post</h1>

            <form method="POST" class="space-y-6">
                {% csrf_token %}

                <!-- Title -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text text-lg font-medium">Post Title</span>
                    </label>
                    <input type="text" name="title" placeholder="Enter an engaging title..."
                        class="input input-bordered input-primary w-full focus:ring-2 focus:ring-primary" required>
                </div>

                <!-- Content -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text text-lg font-medium">Content</span>
                        <span class="label-text-alt text-gray-500">Markdown supported</span>
                    </label>
                    <textarea name="content" rows="12" placeholder="Write your blog post content here..."
                        class="textarea textarea-bordered textarea-primary w-full min-h-48 focus:ring-2 focus:ring-primary"
                        required></textarea>
                </div>

                <!-- Markdown checkbox + Submit -->
                <div class="flex flex-col sm:flex-row sm:items-center gap-4 justify-between mt-6">

                    <!-- Markdown Checkbox -->
                    <div class="form-control flex flex-row items-center gap-2">
                        <input type="checkbox" name="is_markdown" class="checkbox" id="is_markdown">
                        <label for="is_markdown" class="label-text">Is Markdown</label>
                    </div>


                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                        </svg>
                        <span>Publish Post</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
