<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>min-h-screen Demo</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-[#343541] text-white">

        <!-- With min-h-screen -->
        <div class="min-h-screen flex items-center justify-center bg-[#434654]">
            <p class="text-xl font-bold">I'm vertically centered because of min-h-screen 🚀</p>
        </div>

        <!-- Without min-h-screen -->
        <div class="bg-[#202123] p-4">
            <p class="text-xl font-bold">I'm just stacked like normal content 😅</p>
        </div>

    </body>

</html>
